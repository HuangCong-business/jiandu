<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 简牍</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <style>
        /* ================================================
           砚墨设计系统 — 登录页覆盖样式
           ================================================ */

        body {
            background: var(--sidebar-bg);
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            color: var(--text-inverse);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-text {
            font-family: 'Noto Serif SC', serif;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 0.2em;
            color: var(--accent);
            background: none;
            -webkit-text-fill-color: var(--accent);
        }

        .logo-sub {
            font-size: 11px;
            color: var(--text-inverse);
            letter-spacing: 0.25em;
            margin-top: 8px;
            opacity: 0.5;
        }

        /* Card */
        .card {
            background: var(--bg-raised);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 40px 40px 36px;
            box-shadow: var(--shadow-xl);
        }

        .card h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 0.06em;
        }

        .card-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 28px;
            font-size: 13px;
        }

        /* Form groups */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-base);
            border: 1.5px solid var(--border-strong);
            border-radius: var(--r-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Noto Sans SC', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
            background: var(--bg-surface);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        /* Primary button */
        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--r-md);
            font-size: 15px;
            font-weight: 600;
            font-family: 'Noto Sans SC', sans-serif;
            cursor: pointer;
            transition: all 0.18s;
            letter-spacing: 0.05em;
            box-shadow: 0 2px 10px rgba(201, 64, 50, 0.28);
            margin-top: 6px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(201, 64, 50, 0.38);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: var(--border-strong);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 22px 0;
            color: var(--text-muted);
            font-size: 13px;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            background: var(--bg-raised);
            padding: 0 14px;
            position: relative;
            color: var(--text-muted);
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* Message boxes */
        .message {
            padding: 12px 16px;
            border-radius: var(--r-md);
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid transparent;
            display: block;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid transparent;
            display: block;
        }

        /* Back link */
        .back-link {
            text-align: center;
            margin-top: 22px;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }

        .back-link a:hover {
            color: var(--text-inverse);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-text">简牍</div>
            <div class="logo-sub">JIAN DU</div>
        </div>

        <div class="card">
            <h2>欢迎回来</h2>
            <p class="card-subtitle">登录你的简牍账号</p>

            <div id="message" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">
                    登录
                </button>
            </form>

            <div class="links">
                <a href="#" id="forgotPassword">忘记密码？</a>
            </div>

            <div class="divider">
                <span>还没有账号？</span>
            </div>

            <div class="links">
                <a href="/public/register.html">免费注册</a>
            </div>

            <div class="back-link">
                <a href="/public/index.html">← 返回首页</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3001/api';

        // 检查是否已登录（共享 token）
        const savedToken = localStorage.getItem('jiandu_auth_token');
        const savedUser = localStorage.getItem('jiandu_current_user');
        if (savedToken && savedUser) {
            window.location.href = '/workspace-auth.html';
        }

        // 登录表单
        const loginForm = document.getElementById('loginForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';
            showMessage('', '');

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    showMessage(data.error || '用户名或密码错误', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '登录';
                    return;
                }

                showMessage('登录成功！正在跳转...', 'success');
                localStorage.setItem('jiandu_auth_token', data.token);
                localStorage.setItem('jiandu_current_user', JSON.stringify(data.user));

                setTimeout(() => {
                    window.location.href = '/workspace-auth.html';
                }, 800);

            } catch (error) {
                showMessage('网络错误，请确保服务器已启动', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '登录';
            }
        });

        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            showMessage('请联系管理员重置密码', 'error');
        });
    </script>
</body>
</html>
