<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 简牍</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: var(--bg-base); }
        .settings-wrap {
            max-width: 720px;
            margin: 48px auto;
            padding: 0 24px 64px;
        }
        .settings-back {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            padding: 8px 14px;
            border: 1px solid var(--accent-light);
            border-radius: var(--r-md);
            background: var(--accent-light);
            transition: all 0.15s;
        }
        .settings-back:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .settings-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 40px 44px;
            box-shadow: var(--shadow-sm);
        }
        .settings-header {
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .settings-page-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        .settings-page-sub { font-size: 13px; color: var(--text-muted); }
        .settings-section { margin-bottom: 32px; }
        .settings-section-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .settings-item {
            background: var(--bg-base);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 20px 22px;
            margin-bottom: 12px;
            transition: all 0.15s;
        }
        .settings-item:hover { border-color: var(--border-strong); }
        .settings-item-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: block;
        }
        .settings-item-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.6;
        }
        .settings-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border-strong);
            border-radius: var(--r-md);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-surface);
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .settings-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .settings-input::placeholder { color: var(--text-muted); }
        .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .settings-actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
        .btn-test {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-bg);
            padding: 8px 16px;
            border-radius: var(--r-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-test:hover { background: var(--success-text); color: white; }
        .btn-danger {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-bg);
            padding: 8px 16px;
            border-radius: var(--r-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-danger:hover { background: var(--error-text); color: white; }
        .btn-warn {
            background: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-bg);
            padding: 8px 16px;
            border-radius: var(--r-md);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn-warn:hover { background: var(--warning-text); color: white; }
        .api-status { font-size: 12px; margin-left: 12px; line-height: 30px; }
        .status-ok { color: var(--success-text); font-weight: 600; }
        .status-err { color: var(--error-text); font-weight: 600; }
        .btn-save-main {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: var(--r-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 28px;
            font-family: inherit;
            letter-spacing: 0.05em;
            box-shadow: 0 2px 10px rgba(201,64,50,0.25);
            transition: all 0.18s;
        }
        .btn-save-main:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 16px rgba(201,64,50,0.38);
            transform: translateY(-1px);
        }
        .tips-box {
            margin-top: 24px;
            padding: 16px 20px;
            background: var(--warning-bg);
            border: 1px solid var(--border);
            border-left: 3px solid #E8A020;
            border-radius: var(--r-md);
        }
        .tips-box-title { font-size: 13px; font-weight: 700; color: var(--warning-text); margin-bottom: 8px; }
        .tips-box li { font-size: 13px; color: var(--text-secondary); line-height: 1.8; margin-left: -16px; }
    </style>
</head>
<body>
    <div class="settings-wrap">
        <a href="index.html" class="settings-back">⚙️ 返回设置</a>
        <div class="settings-card">
            <div class="settings-header">
                <div class="settings-page-title">⚙️ 系统设置</div>
                <div class="settings-page-sub">配置 API、模型偏好和本地数据</div>
            </div>

            <form id="settingsForm">
                <!-- API 配置 -->
                <div class="settings-section">
                    <div class="settings-section-title">🔑 API 配置</div>
                    <div class="settings-item">
                        <label class="settings-item-label" for="apiKey">DeepSeek API Key</label>
                        <input class="settings-input" type="password" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx">
                        <p class="settings-item-desc">
                            获取方式：<a href="https://platform.deepseek.com" target="_blank" style="color:var(--accent)">DeepSeek 平台</a> → 注册/登录 → API Keys → 创建新密钥
                        </p>
                        <div class="settings-actions">
                            <button type="button" class="btn-test" onclick="testApiKey()">🧪 测试连接</button>
                            <span class="api-status" id="apiStatus"></span>
                        </div>
                    </div>
                </div>

                <!-- 模型选择 -->
                <div class="settings-section">
                    <div class="settings-section-title">🤖 模型偏好</div>
                    <div class="settings-item">
                        <label class="settings-item-label" for="modelSelect">AI 模型</label>
                        <select class="settings-input" id="modelSelect">
                            <option value="deepseek-chat">DeepSeek Chat（通用推荐）</option>
                            <option value="deepseek-coder">DeepSeek Coder（代码生成更强）</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <div class="settings-item">
                            <label class="settings-item-label" for="timeout">请求超时（秒）</label>
                            <input class="settings-input" type="number" id="timeout" value="60" min="10" max="300">
                        </div>
                        <div class="settings-item">
                            <label class="settings-item-label" for="maxFix">自动修复次数</label>
                            <input class="settings-input" type="number" id="maxFix" value="3" min="1" max="5">
                        </div>
                    </div>
                </div>

                <!-- 数据管理 -->
                <div class="settings-section">
                    <div class="settings-section-title">💾 数据管理</div>
                    <div class="settings-item">
                        <label class="settings-item-label">分析历史记录</label>
                        <div style="display:flex;gap:10px;">
                            <button type="button" class="btn-danger" onclick="clearHistory()">🗑️ 清空历史</button>
                            <button type="button" class="btn-warn" onclick="clearCache()">🧹 清除缓存</button>
                        </div>
                        <p class="settings-item-desc">清空后数据无法恢复</p>
                    </div>
                </div>

                <button type="submit" class="btn-save-main">💾 保存设置</button>

                <div class="tips-box">
                    <div class="tips-box-title">💡 提示</div>
                    <ul>
                        <li>保存后请按 <strong>F5</strong> 刷新工作空间页面，确保 API Key 生效</li>
                        <li>若功能异常，按 <strong>F12</strong> 打开控制台查看错误信息</li>
                        <li>API Key 须以 <strong>sk-</strong> 开头，请勿包含空格</li>
                    </ul>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem.bind(localStorage);
            if (saved('deepseek_api_key')) document.getElementById('apiKey').value = saved('deepseek_api_key');
            if (saved('deepseek_model')) document.getElementById('modelSelect').value = saved('deepseek_model');
            if (saved('deepseek_timeout')) document.getElementById('timeout').value = saved('deepseek_timeout');
            if (saved('deepseek_maxfix')) document.getElementById('maxFix').value = saved('deepseek_maxfix');
            updateApiStatus(!!saved('deepseek_api_key') && saved('deepseek_api_key').startsWith('sk-'));
        });

        document.getElementById('settingsForm').addEventListener('submit', e => {
            e.preventDefault();
            const key = document.getElementById('apiKey').value.trim();
            if (!key) { alert('请填写 API Key'); return; }
            localStorage.setItem('deepseek_api_key', key);
            localStorage.setItem('deepseek_model', document.getElementById('modelSelect').value);
            localStorage.setItem('deepseek_timeout', document.getElementById('timeout').value);
            localStorage.setItem('deepseek_maxfix', document.getElementById('maxFix').value);
            updateApiStatus(true);
            alert('✅ 设置已保存！现在可以返回首页开始分析。');
        });

        function updateApiStatus(valid) {
            const el = document.getElementById('apiStatus');
            el.innerHTML = valid
                ? '<span class="status-ok">✓ 已保存</span>'
                : '<span class="status-err">✗ 未配置</span>';
        }

        async function testApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            const status = document.getElementById('apiStatus');
            if (!key) { alert('请先填写 API Key'); return; }
            if (!key.startsWith('sk-')) { status.innerHTML = '<span class="status-err">格式错误</span>'; return; }
            status.innerHTML = '<span style="color:var(--text-muted)">⏳ 测试中...</span>';
            try {
                const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: [{role:'system',content:'只需回复OK'},{role:'user',content:'test'}], max_tokens: 5 })
                });
                if (res.ok) {
                    status.innerHTML = '<span class="status-ok">✓ 连接成功</span>';
                    alert('✅ API Key 有效，连接正常！');
                } else if (res.status === 401) {
                    status.innerHTML = '<span class="status-err">✗ Key 无效</span>';
                    alert('❌ API Key 无效 (401)：请检查是否正确复制，是否已过期或账户余额充足。');
                } else if (res.status === 429) {
                    status.innerHTML = '<span class="status-err">⚠ 额度不足</span>';
                    alert('⚠ 额度不足或请求超限 (429)：请检查账户余额或稍后再试。');
                } else {
                    status.innerHTML = `<span class="status-err">✗ 错误 ${res.status}</span>`;
                }
            } catch(e) {
                status.innerHTML = '<span class="status-err">✗ 网络错误</span>';
                alert('网络错误：' + e.message);
            }
        }

        function clearHistory() {
            if (!confirm('确定清空所有历史记录？此操作不可恢复！')) return;
            const req = indexedDB.open('JianDuDB', 1);
            req.onsuccess = () => {
                req.result.transaction(['analysisHistory'], 'readwrite').objectStore('analysisHistory').clear();
                alert('✅ 历史记录已清空');
            };
        }

        function clearCache() {
            if (!confirm('确定清除浏览器缓存？页面将自动刷新。')) return;
            caches.keys().then(ns => ns.forEach(n => caches.delete(n)));
            localStorage.clear();
            location.reload();
        }

        document.getElementById('apiKey').addEventListener('input', e => {
            updateApiStatus(e.target.value.trim().startsWith('sk-'));
        });
    </script>
</body>
</html>
