<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简牍 - 后台管理系统</title>
    <!-- 砚墨设计系统 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ================================================
           简牍后台管理 — 砚墨设计系统样式覆盖
           ================================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-base);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-primary);
        }

        /* ── 外层容器 ─────────────────────────────────── */
        .container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 600px;
        }

        /* ── 认证表单区（登录/注册） ──────────────────── */
        .auth-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: var(--accent);
            font-size: 32px;
            margin-bottom: 10px;
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 0.05em;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border-strong);
            border-radius: var(--r-md);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-base);
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
            background: var(--bg-surface);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        /* ── 按钮系统 ────────────────────────────────── */
        .btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--r-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.18s;
            font-family: inherit;
            letter-spacing: 0.04em;
            box-shadow: 0 2px 8px rgba(201, 64, 50, 0.25);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(201, 64, 50, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-base);
            color: var(--text-secondary);
            border: 1.5px solid var(--border-strong);
            box-shadow: none;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
            box-shadow: none;
            transform: none;
        }

        /* ── 提示框 ──────────────────────────────────── */
        .alert {
            padding: 12px 16px;
            border-radius: var(--r-md);
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid transparent;
        }

        .alert-error {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-bg);
        }

        .alert-success {
            background: var(--success-bg);
            color: var(--success-text);
            border-color: var(--success-bg);
        }

        .alert-info {
            background: #EDF2FF;
            color: #4338CA;
            border-color: #C7D2FE;
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .switch-form a {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .switch-form a:hover {
            text-decoration: underline;
        }

        /* ── 仪表盘主体 ───────────────────────────────── */
        .dashboard {
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        /* 仪表盘头部 — 砚墨黑底，朱红品牌 */
        .dashboard-header {
            background: var(--sidebar-bg);
            color: var(--text-inverse);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dashboard-header h2 {
            font-size: 24px;
            color: var(--text-inverse);
            font-family: 'Noto Serif SC', serif;
        }

        /* 反馈统计卡片 */
        .feedback-stat {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 16px;
            border-radius: var(--r-md);
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-inverse);
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feedback-stat:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(201, 64, 50, 0.4);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: white;
        }

        /* 仪表盘内容区 */
        .dashboard-content {
            padding: 30px;
            background: var(--bg-base);
            min-height: calc(100vh - 80px);
        }

        /* ── 统计卡片网格 ────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.2s, transform 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-card h3 {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 500;
            letter-spacing: 0.04em;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
            font-family: 'Noto Serif SC', serif;
        }

        /* ── 表格容器 ────────────────────────────────── */
        .table-container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--bg-surface);
        }

        .table-header h3 {
            color: var(--text-primary);
            font-size: 18px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 8px 12px;
            border: 1.5px solid var(--border-strong);
            border-radius: var(--r-md);
            font-size: 14px;
            color: var(--text-primary);
            background: var(--bg-base);
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-raised);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.05em;
            padding: 12px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-primary);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--bg-base);
        }

        /* ── 徽章系统 ────────────────────────────────── */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: var(--r-full);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-admin {
            background: var(--accent-light);
            color: var(--accent);
        }

        .badge-user {
            background: var(--bg-raised);
            color: var(--text-secondary);
        }

        .badge-active {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .badge-inactive {
            background: var(--bg-raised);
            color: var(--text-muted);
        }

        .badge-banned {
            background: var(--error-bg);
            color: var(--error-text);
        }

        /* ── 操作按钮 ────────────────────────────────── */
        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: var(--r-sm);
            width: auto;
        }

        .btn-sm.btn-danger {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid transparent;
        }

        .btn-sm.btn-danger:hover {
            background: var(--error-text);
            color: white;
        }

        /* ── 分页 ───────────────────────────────────── */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 20px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 8px 16px;
            border: 1.5px solid var(--border-strong);
            background: var(--bg-surface);
            border-radius: var(--r-md);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            color: var(--text-secondary);
            font-family: inherit;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ── 模态框 ─────────────────────────────────── */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(24, 18, 14, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-xl);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            color: var(--text-primary);
            font-size: 20px;
            font-family: 'Noto Serif SC', serif;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
            padding: 2px 6px;
            border-radius: var(--r-sm);
            transition: color 0.15s;
        }

        .close-modal:hover {
            color: var(--text-primary);
        }

        /* ── 工具类 ──────────────────────────────────── */
        .hidden {
            display: none !important;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录表单 -->
        <div id="loginForm" class="auth-container">
            <div class="logo">
                <h1>📜 简牍</h1>
                <p>后台管理系统</p>
            </div>
            <div id="loginAlert"></div>
            <form id="loginFormEl">
                <div class="form-group">
                    <label for="loginUsername">用户名 / 邮箱</label>
                    <input type="text" id="loginUsername" required placeholder="请输入用户名或邮箱">
                </div>
                <div class="form-group">
                    <label for="loginPassword">密码</label>
                    <input type="password" id="loginPassword" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn">登录</button>
            </form>
            <div class="switch-form">
                还没有账户？<a onclick="showRegister()">立即注册</a>
            </div>
        </div>

        <!-- 注册表单 -->
        <div id="registerForm" class="auth-container hidden">
            <div class="logo">
                <h1>📜 简牍</h1>
                <p>创建新账户</p>
            </div>
            <div id="registerAlert"></div>
            <form id="registerFormEl">
                <div class="form-group">
                    <label for="regUsername">用户名</label>
                    <input type="text" id="regUsername" required placeholder="请输入用户名">
                </div>
                <div class="form-group">
                    <label for="regEmail">邮箱</label>
                    <input type="email" id="regEmail" required placeholder="请输入邮箱">
                </div>
                <div class="form-group">
                    <label for="regPassword">密码</label>
                    <input type="password" id="regPassword" required placeholder="请输入密码（至少 6 位）" minlength="6">
                </div>
                <button type="submit" class="btn">注册</button>
            </form>
            <div class="switch-form">
                已有账户？<a onclick="showLogin()">返回登录</a>
            </div>
        </div>

        <!-- 管理后台 -->
        <div id="dashboard" class="dashboard">
            <div class="dashboard-header">
                <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
                    <h2>📜 简牍后台管理</h2>
                    <div class="feedback-stat" onclick="window.open('feedback.html', '_blank')" title="查看用户反馈">
                        💬 用户反馈管理
                    </div>
                </div>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div>
                        <div id="userName" style="color: var(--text-inverse); font-weight: 600;">用户</div>
                        <div style="font-size: 12px; opacity: 0.7; color: var(--sidebar-muted);" id="userRole">普通用户</div>
                    </div>
                    <button onclick="logout()" class="btn btn-secondary" style="width: auto; padding: 8px 16px; margin-left: 10px;">退出</button>
                </div>
            </div>
            <div class="dashboard-content">
                <div id="dashboardAlert"></div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>总用户数</h3>
                        <div class="number" id="totalUsers">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>活跃用户</h3>
                        <div class="number" id="activeUsers">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>管理员</h3>
                        <div class="number" id="adminUsers">0</div>
                    </div>
                </div>

                <div class="table-container">
                    <div class="table-header">
                        <h3>用户管理</h3>
                        <div class="search-box">
                            <input type="text" id="searchInput" placeholder="搜索用户名或邮箱..." style="min-width: 200px;">
                            <button onclick="searchUsers()" class="btn btn-secondary" style="width: auto; padding: 8px 16px;">搜索</button>
                            <button onclick="showCreateUserModal()" class="btn" style="width: auto; padding: 8px 16px;" id="createUserBtn">+ 新建用户</button>
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>邮箱</th>
                                <th>角色</th>
                                <th>模型</th>
                                <th>状态</th>
                                <th>注册时间</th>
                                <th>最后登录</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr><td colspan="8" class="loading">加载中...</td></tr>
                        </tbody>
                    </table>
                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建/编辑用户模态框 -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">创建用户</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="userFormEl">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label for="modalUsername">用户名</label>
                    <input type="text" id="modalUsername" required>
                </div>
                <div class="form-group">
                    <label for="modalEmail">邮箱</label>
                    <input type="email" id="modalEmail" required>
                </div>
                <div class="form-group">
                    <label for="modalPassword">密码</label>
                    <input type="password" id="modalPassword" placeholder="留空则不修改（仅编辑时）">
                </div>
                <div class="form-group">
                    <label for="modalRole">角色</label>
                    <select id="modalRole">
                        <option value="user">普通用户</option>
                        <option value="admin">管理员</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalStatus">状态</label>
                    <select id="modalStatus">
                        <option value="active">活跃</option>
                        <option value="inactive">未激活</option>
                        <option value="banned">已禁用</option>
                    </select>
                </div>
                    <label for="modalModel">AI 模型</label>
                    <select id="modalModel">
                        <option value="deepseek-chat">DeepSeek Chat（通用推荐）</option>
                        <option value="deepseek-coder">DeepSeek Coder（代码生成更强）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="modalApiKey">用户 API Key（优先级高于全局设置）</label>
                    <input type="password" id="modalApiKey" placeholder="sk-xxx…xxxx，留空则使用系统默认">
                    <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">若填写此字段，用户将使用自己的 API Key 而非系统默认</p>
                </div>
                <button type="submit" class="btn">保存</button>
            </form>
        </div>
    </div>

    <!-- 重置密码模态框 -->
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>重置密码</h3>
                <button class="close-modal" onclick="closeResetPasswordModal()">&times;</button>
            </div>
            <form id="resetPasswordFormEl">
                <input type="hidden" id="resetUserId">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="至少 6 位">
                </div>
                <button type="submit" class="btn">确认重置</button>
            </form>
        </div>
    </div>

    <script>
        // API 地址（固定使用 3001 端口）
        const API_BASE = 'http://localhost:3001';

        let token = localStorage.getItem('token');
        let currentUser = null;
        let currentPage = 1;
        let currentSearch = '';

        if (token) loadCurrentUser();

        function showLogin() {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('active');
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('dashboard').classList.remove('active');
        }

        function showAlert(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => el.innerHTML = '', 5000);
        }

        document.getElementById('loginFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    currentUser = data.user;
                    localStorage.setItem('token', token);
                    // 登录后立即权限检查，非管理员/意见收集员直接跳转
                    if (currentUser.role !== 'admin' && currentUser.role !== 'feedback_collector') {
                        logout();
                        window.location.href = 'http://localhost:3001/workspace-auth.html';
                        return;
                    }
                    showDashboard();
                } else {
                    showAlert('loginAlert', data.error, 'error');
                }
            } catch (error) {
                showAlert('loginAlert', '登录失败，请检查网络连接', 'error');
            }
        });

        document.getElementById('registerFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('registerAlert', '注册成功！请登录', 'success');
                    setTimeout(() => showLogin(), 1500);
                } else {
                    showAlert('registerAlert', data.error, 'error');
                }
            } catch (error) {
                showAlert('registerAlert', '注册失败，请检查网络连接', 'error');
            }
        });

        async function loadCurrentUser() {
            try {
                const response = await fetch(`${API_BASE}/api/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    // 权限检查：非管理员/意见收集员直接跳转
                    if (currentUser.role !== 'admin' && currentUser.role !== 'feedback_collector') {
                        logout();
                        window.location.href = 'http://localhost:3001/workspace-auth.html';
                        return;
                    }
                    showDashboard();
                } else {
                    logout();
                }
            } catch (error) {
                logout();
            }
        }

        function showDashboard() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.add('hidden');

            // 非管理员/意见收集员 → 直接跳转回工具主页
            if (currentUser.role !== 'admin' && currentUser.role !== 'feedback_collector') {
                alert('⚠️ 您的账户权限不足\n\n只有管理员和意见收集员可以访问后台管理系统\n\n正在返回首页...');
                logout();
                window.location.href = 'http://localhost:3001/workspace-auth.html';
                return;
            }

            document.getElementById('dashboard').classList.add('active');

            document.getElementById('userName').textContent = currentUser.username;
            const roleText = currentUser.role === 'admin' ? '管理员' :
                            currentUser.role === 'feedback_collector' ? '意见收集员' : '普通用户';
            document.getElementById('userRole').textContent = roleText;
            document.getElementById('userAvatar').textContent = currentUser.username.charAt(0).toUpperCase();

            // 仅完全管理员可以创建用户
            document.getElementById('createUserBtn').style.display = currentUser.role === 'admin' ? 'block' : 'none';

            if (currentUser.role === 'feedback_collector') {
                document.getElementById('dashboardAlert').innerHTML =
                    '<div class="alert alert-info">💡 您是意见收集员，可以查看用户列表和管理反馈，但不能修改/删除用户。</div>';
            }

            loadUsers();
        }

        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            showLogin();
        }

        async function loadUsers(page = 1, search = '') {
            currentPage = page;
            currentSearch = search;

            try {
                const params = new URLSearchParams({ page, limit: 10, search });
                const response = await fetch(`${API_BASE}/api/users?${params}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    renderUserTable(data.users);
                    renderPagination(data.pagination);
                    updateStats(data.pagination.total);
                } else {
                    showAlert('dashboardAlert', data.error, 'error');
                }
            } catch (error) {
                showAlert('dashboardAlert', '加载用户列表失败', 'error');
            }
        }

        function searchUsers() {
            const search = document.getElementById('searchInput').value;
            loadUsers(1, search);
        }

        function renderUserTable(users) {
            const tbody = document.getElementById('userTableBody');

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="loading">暂无用户</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${escapeHtml(user.username)}</td>
                    <td>${escapeHtml(user.email)}</td>
                    <td><span class="badge badge-${user.role}">${user.role === 'admin' ? '管理员' : user.role === 'feedback_collector' ? '意见收集员' : '用户'}</span></td>
                    <td>${user.model || 'deepseek-chat'}</td>
                    <td><span class="badge badge-${user.status}">${user.status === 'active' ? '活跃' : user.status === 'inactive' ? '未激活' : '已禁用'}</span></td>
                    <td>${formatDate(user.created_at)}</td>
                    <td>${user.last_login ? formatDate(user.last_login) : '从未'}</td>
                    <td class="actions">
                        ${currentUser.role === 'admin' ? `
                            <button onclick="editUser(${user.id})" class="btn btn-sm btn-secondary">编辑</button>
                            <button onclick="showResetPassword(${user.id})" class="btn btn-sm btn-secondary">重置密码</button>
                            ${user.id !== currentUser.id ? `<button onclick="deleteUser(${user.id})" class="btn btn-sm btn-danger">删除</button>` : ''}
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(pagination) {
            const { page, totalPages } = pagination;
            const paginationEl = document.getElementById('pagination');

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button onclick="loadUsers(${page - 1}, '${currentSearch}')" ${page === 1 ? 'disabled' : ''}>上一页</button>`;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="loadUsers(${i}, '${currentSearch}')" ${i === page ? 'class="active"' : ''}>${i}</button>`;
            }

            html += `<button onclick="loadUsers(${page + 1}, '${currentSearch}')" ${page === totalPages ? 'disabled' : ''}>下一页</button>`;

            paginationEl.innerHTML = html;
        }

        function updateStats(total) {
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('activeUsers').textContent = total;
            document.getElementById('adminUsers').textContent = '-';
        }

        function showCreateUserModal() {
            document.getElementById('modalTitle').textContent = '创建用户';
            document.getElementById('editUserId').value = '';
            document.getElementById('modalUsername').value = '';
            document.getElementById('modalEmail').value = '';
            document.getElementById('modalPassword').value = '';
            document.getElementById('modalPassword').required = true;
            document.getElementById('modalRole').value = 'user';
            document.getElementById('modalStatus').value = 'active';
            document.getElementById('modalModel').value = 'deepseek-chat';
            document.getElementById('modalApiKey').value = '';
            document.getElementById('userModal').classList.add('active');
        }

        async function editUser(id) {
            try {
                const response = await fetch(`${API_BASE}/api/users/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    const user = data.user;
                    document.getElementById('modalTitle').textContent = '编辑用户';
                    document.getElementById('editUserId').value = user.id;
                    document.getElementById('modalUsername').value = user.username;
                    document.getElementById('modalEmail').value = user.email;
                    document.getElementById('modalPassword').value = '';
                    document.getElementById('modalPassword').required = false;
                    document.getElementById('modalRole').value = user.role;
                    document.getElementById('modalStatus').value = user.status;
                    document.getElementById('modalModel').value = user.model || 'deepseek-chat';
                    document.getElementById('modalApiKey').value = user.api_key || '';
                    document.getElementById('userModal').classList.add('active');
                }
            } catch (error) {
                showAlert('dashboardAlert', '加载用户信息失败', 'error');
            }
        }

        function closeModal() {
            document.getElementById('userModal').classList.remove('active');
        }

        document.getElementById('userFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('editUserId').value;
            const username = document.getElementById('modalUsername').value;
            const email = document.getElementById('modalEmail').value;
            const password = document.getElementById('modalPassword').value;
            const role = document.getElementById('modalRole').value;
            const status = document.getElementById('modalStatus').value;
            const model = document.getElementById('modalModel').value;
            const api_key = document.getElementById('modalApiKey').value.trim();

            try {
                let response;
                if (userId) {
                    const body = { username, email, role, status, model, api_key };
                    if (password) body.password = password;

                    response = await fetch(`${API_BASE}/api/users/${userId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(body)
                    });
                } else {
                    response = await fetch(`${API_BASE}/api/users`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ username, email, password, role, model, api_key })
                    });
                }

                const data = await response.json();

                if (response.ok) {
                    closeModal();
                    showAlert('dashboardAlert', userId ? '用户更新成功' : '用户创建成功', 'success');
                    loadUsers(currentPage, currentSearch);
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('操作失败');
            }
        });

        async function deleteUser(id) {
            if (!confirm('确定要删除该用户吗？此操作不可恢复！')) return;

            try {
                const response = await fetch(`${API_BASE}/api/users/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('dashboardAlert', '用户删除成功', 'success');
                    loadUsers(currentPage, currentSearch);
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('删除失败');
            }
        }

        function showResetPassword(id) {
            document.getElementById('resetUserId').value = id;
            document.getElementById('newPassword').value = '';
            document.getElementById('resetPasswordModal').classList.add('active');
        }

        function closeResetPasswordModal() {
            document.getElementById('resetPasswordModal').classList.remove('active');
        }

        document.getElementById('resetPasswordFormEl').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = document.getElementById('resetUserId').value;
            const newPassword = document.getElementById('newPassword').value;

            try {
                const response = await fetch(`${API_BASE}/api/users/reset-password`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ userId, newPassword })
                });

                const data = await response.json();

                if (response.ok) {
                    closeResetPasswordModal();
                    showAlert('dashboardAlert', '密码重置成功', 'success');
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert('重置失败');
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUsers();
        });

        // 页面加载时检查登录状态（支持共享 Token）
        window.addEventListener('DOMContentLoaded', () => {
            // 优先检查工具主页的 Token（共享登录状态）
            const sharedToken = localStorage.getItem('jiandu_auth_token');
            const sharedUser = localStorage.getItem('jiandu_current_user');
            const localToken = localStorage.getItem('token');

            if (sharedToken && sharedUser) {
                // 使用工具主页的 Token，通过 API 验证真实权限
                token = sharedToken;
                loadCurrentUser();
                return;
            } else if (localToken) {
                // 使用后台管理的本地 Token
                token = localToken;
                loadCurrentUser();
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
