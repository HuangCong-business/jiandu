<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简牍 - 工作空间</title>
    <script src="./pyodide/pyodide.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260316">
    <style>
        /* ── 全局重置 ─────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--sidebar-bg);
            min-height: 100vh;
            display: flex;
        }

        /* ── 侧边栏 ──────────────────────────────────────── */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            overflow: hidden;
        }

        /* 砚墨质感纹理 */
        .sidebar::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 24px,
                    rgba(255,255,255,0.012) 24px,
                    rgba(255,255,255,0.012) 25px
                );
            pointer-events: none;
            z-index: 0;
        }

        /* ── Logo 区 ─────────────────────────────────────── */
        .logo-container { margin-bottom: 30px; position: relative; z-index: 1; }
        .logo-main { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 20px; }
        .logo {
            font-family: 'Noto Serif SC', serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 14px;
            color: var(--text-inverse);
        }
        .logo-sub {
            font-size: 11px;
            color: var(--sidebar-muted);
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* 工作空间标签 */
        .workspace-label {
            font-size: 11px;
            color: var(--sidebar-muted);
            letter-spacing: 4px;
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--sidebar-border);
        }

        /* ── 模块卡片 ─────────────────────────────────────── */
        .module-card {
            background: rgba(255,255,255,0.03);
            padding: 18px;
            border-radius: var(--r-lg);
            margin-bottom: 20px;
            border: 1px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }

        .module-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .m-label {
            font-size: 11px;
            color: var(--sidebar-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .file-actions { display: flex; gap: 8px; }

        .action-btn {
            width: 28px;
            height: 28px;
            border-radius: var(--r-sm);
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add {
            background: var(--accent);
            color: white;
        }
        .btn-add:hover {
            background: var(--accent-hover);
            transform: scale(1.08);
            box-shadow: 0 4px 12px rgba(201,64,50,0.35);
        }

        .btn-remove {
            background: rgba(255,255,255,0.1);
            color: var(--sidebar-muted);
            border: 1px solid var(--sidebar-border);
        }
        .btn-remove:hover {
            background: var(--error-bg);
            color: var(--error-text);
            border-color: var(--error-text);
            transform: scale(1.08);
        }

        /* ── 文件列表 ─────────────────────────────────────── */
        .file-scroller { max-height: 200px; overflow-y: auto; }
        .file-scroller::-webkit-scrollbar { width: 4px; }
        .file-scroller::-webkit-scrollbar-track { background: var(--sidebar-bg); border-radius: 2px; }
        .file-scroller::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 2px; }

        .file-item {
            font-size: 12px;
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: var(--r-sm);
            margin-top: 8px;
            border-left: 3px solid var(--accent);
            border-top: 1px solid var(--sidebar-border);
            border-right: 1px solid var(--sidebar-border);
            border-bottom: 1px solid var(--sidebar-border);
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-item:hover {
            background: rgba(255,255,255,0.06);
            border-left-color: var(--accent);
            transform: translateX(3px);
        }

        .file-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .file-name {
            color: var(--sidebar-text);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-meta { font-size: 10px; color: var(--sidebar-muted); margin-left: 8px; }

        .btn-remove-file {
            background: none;
            border: none;
            color: var(--sidebar-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn-remove-file:hover {
            background: rgba(201,64,50,0.15);
            color: var(--accent);
        }

        /* ── 引擎状态 ─────────────────────────────────────── */
        .engine-state {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--sidebar-muted);
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--sidebar-border);
            position: relative;
            z-index: 1;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        /* ── 主内容区 ─────────────────────────────────────── */
        .main-content {
            margin-left: 280px;
            flex: 1;
            background: var(--bg-base);
            min-height: 100vh;
            padding: 40px;
            overflow-y: auto;
        }

        /* ── 工作空间头部 ─────────────────────────────────── */
        .workspace-header {
            background: var(--bg-surface);
            padding: 30px;
            border-radius: var(--r-xl);
            border: 1px solid var(--border);
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
        }
        .workspace-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        .workspace-slogan {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ── 输入面板 ─────────────────────────────────────── */
        .input-panel {
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: var(--r-xl);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-panel:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-md), 0 0 0 3px var(--accent-light);
        }

        textarea {
            width: 100%;
            height: 100px;
            border: none;
            border-bottom: 1.5px solid var(--border);
            font-size: 15px;
            outline: none;
            resize: none;
            color: var(--text-primary);
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: transparent;
            padding-bottom: 8px;
        }
        textarea:focus {
            border-bottom-color: var(--accent);
        }
        textarea::placeholder { color: var(--text-muted); }

        .panel-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .tips {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── 主按钮 .btn-run ──────────────────────────────── */
        .btn-run {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: var(--r-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.18s;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(201,64,50,0.25);
        }
        .btn-run:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(201,64,50,0.35);
        }
        .btn-run:disabled {
            background: var(--border-strong);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── 输出面板 ─────────────────────────────────────── */
        .output-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 30px;
            min-height: 300px;
            box-shadow: var(--shadow-sm);
        }

        /* ── 返回按钮 ─────────────────────────────────────── */
        .back-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--bg-surface);
            border: 1px solid var(--border-strong);
            border-radius: var(--r-md);
            padding: 10px 16px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
            z-index: 100;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: var(--shadow-sm);
        }
        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* ── 加载遮罩 ─────────────────────────────────────── */
        .loader-mask {
            position: fixed;
            inset: 0;
            background: rgba(250,247,242,0.88);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-box {
            text-align: center;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: 48px 56px;
            box-shadow: var(--shadow-xl);
        }

        /* ── 欢迎框 ───────────────────────────────────────── */
        .welcome-box {
            padding: 8px 0;
        }
        .welcome-box h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        .welcome-box p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.8;
        }

        /* ── 工具类 ───────────────────────────────────────── */
        .hidden { display: none !important; }

        /* ── 预览表格 (JS 生成) ────────────────────────────── */
        .preview-table-container {
            margin-top: 15px;
            max-height: 200px;
            overflow: auto;
            border-radius: var(--r-md);
            border: 1px solid var(--border);
        }
        .preview-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        .preview-table th {
            background: var(--bg-raised);
            padding: 8px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-primary);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border-strong);
        }
        .preview-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .preview-table tr:hover td {
            background: var(--bg-raised);
        }

        /* 徽章 */
        .badge {
            background: var(--accent-light);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: var(--r-full);
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">
            <div class="logo-main">
                <div class="logo">简牍</div>
                <div class="logo-sub">JIAN DU</div>
            </div>
            <div class="workspace-label">工作空间</div>
        </div>

        <div class="module-card">
            <div class="module-header">
                <span class="m-label">📄 待研读简牍</span>
                <div class="file-actions">
                    <button class="action-btn btn-add" onclick="document.getElementById('fileInput').click()" title="添加文件">+</button>
                    <button class="action-btn btn-remove" onclick="clearAllFiles()" title="清除全部">×</button>
                </div>
            </div>
            <input type="file" id="fileInput" multiple accept=".xlsx,.csv" style="display:none">
            <div id="fileList" class="file-scroller"></div>
        </div>

        <div class="engine-state">
            <div id="envDot" class="status-dot"></div>
            <span id="envStatus">引擎冷启动...</span>
        </div>
    </aside>

    <main class="main-content">
        <div class="workspace-header">
            <div class="workspace-title">📊 数据分析工作空间</div>
            <div class="workspace-slogan">言出法随 · 让复杂数据化繁为简</div>
        </div>

        <div class="input-panel">
            <textarea id="userInput" placeholder="请输入您的处理需求（例如：比对来源 A 和 B，找出 ID 相同但单价不符的记录...）"></textarea>
            <div class="panel-bottom">
                <div class="tips">💡 提示：支持 Excel (.xlsx) 和 CSV 格式，自动检测编码</div>
                <button id="analyzeBtn" class="btn-run" disabled>开启自动化研读</button>
            </div>
        </div>

        <div id="resultContent" class="output-panel">
            <div class="welcome-box">
                <h3>欢迎使用简牍</h3>
                <p>
                    请上传 Excel 或 CSV 文件，并用日常语言描述您的处理逻辑。<br>
                    系统会自动生成 Python 代码执行分析，并生成报告。
                </p>
                <p style="margin-top: 20px; font-size: 13px; color: var(--text-muted);">
                    💡 从历史记录加载的文件会自动显示在左侧
                </p>
            </div>
        </div>
    </main>

    <div id="loader" class="loader-mask hidden">
        <div class="loader-box">
            <div class="spinner"></div>
            <p id="loaderText" style="color: var(--accent); font-weight: 600;">AI 正在深度研读简牍数据...</p>
        </div>
    </div>

    <script src="js/app.js?v=20260317b"></script>
</body>
</html>
